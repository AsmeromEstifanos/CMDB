name: Deploy to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cpanel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Validate deployment secrets
        env:
          CPANEL_SERVER: ${{ secrets.CPANEL_SERVER }}
          CPANEL_USERNAME: ${{ secrets.CPANEL_USERNAME }}
          CPANEL_PASSWORD: ${{ secrets.CPANEL_PASSWORD }}
          CPANEL_PORT: ${{ secrets.CPANEL_PORT }}
          CPANEL_SERVER_DIR: ${{ secrets.CPANEL_SERVER_DIR }}
        shell: bash
        run: |
          for name in CPANEL_SERVER CPANEL_USERNAME CPANEL_PASSWORD CPANEL_PORT CPANEL_SERVER_DIR; do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing GitHub secret::${name} is not set"
              exit 1
            fi
          done

          if [[ "${CPANEL_SERVER_DIR}" != */ ]]; then
            echo "::error title=Invalid CPANEL_SERVER_DIR::CPANEL_SERVER_DIR must end with a trailing slash, for example /public_html/cmdb/ or /"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build production app
        env:
          PUBLIC_URL: /cmdb
          # CRA treats warnings as build failures when CI=true.
          CI: "false"
        run: npm run build

      - name: Deploy build folder to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CPANEL_SERVER }}
          username: ${{ secrets.CPANEL_USERNAME }}
          password: ${{ secrets.CPANEL_PASSWORD }}
          protocol: ftps
          port: ${{ secrets.CPANEL_PORT }}
          local-dir: ./build/
          server-dir: ${{ secrets.CPANEL_SERVER_DIR }}
          exclude: |
            **/.git*
            **/.git*/**

